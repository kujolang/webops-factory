<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kujo WebOps Factory</title><style>
:root{color-scheme:dark;--bg:#111214;--panel:#1c1e20;--line:#383b3f;--muted:#a4a9af;--paper:#eeeee9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4ee;font:15px/1.5 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:22px 4vw;border-bottom:1px solid var(--line);gap:20px}.brand{display:flex;gap:20px;align-items:center}.brand b{font-size:28px;letter-spacing:-1px}.brand span{font:12px monospace;letter-spacing:2px;border-left:1px solid #555;padding-left:20px}select,button{font:inherit;color:inherit}select{background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:6px;max-width:450px}button{cursor:pointer}a{color:inherit;text-underline-offset:4px}main{max-width:1550px;margin:auto;padding:30px 4vw 55px}.eyebrow{font:11px monospace;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(30px,3.4vw,48px);letter-spacing:-1.7px;line-height:1.15;margin:12px 0}h2{font-size:23px;letter-spacing:-.6px;margin:0 0 8px}h3{font-size:16px;margin:0}p{color:var(--muted);margin:8px 0 0}.hero{display:flex;align-items:center;justify-content:space-between;gap:35px}.pill{padding:9px 16px;border:1px solid #777;border-radius:25px;font-size:12px;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin:26px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.metric{padding:16px 22px;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;gap:16px}.metric strong{font-size:32px;font-weight:500}.metric span{color:var(--muted);font-size:12px}.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:24px}.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 0 15px}.tabs button[aria-selected=true]{color:white;border-color:white}.view[hidden]{display:none}.canvas{border:1px solid var(--line);border-radius:12px;padding:25px;background:radial-gradient(#34373b 1px,transparent 1px) 0 0/20px 20px}.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;position:relative}.flow:before{content:'';position:absolute;left:6%;right:6%;top:50%;height:1px;background:#777}.station{z-index:1;position:relative;padding:16px;text-align:left;min-height:145px;background:#202327;border:1px solid #555a60;border-radius:9px}.station .number{font:25px monospace;display:block;margin-bottom:16px}.station small{display:block;font-size:10px;color:var(--muted);margin-top:5px}.station em{font:10px monospace;font-style:normal;display:block;margin-top:12px;text-transform:uppercase}.station.active{background:var(--paper);color:#161719}.station.active small{color:#555}.detail{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-top:20px;padding:20px 24px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.detail p{max-width:800px}.gate{margin:20px 0;padding:18px 22px;border:1px solid #6c7075;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:20px}.gate p{font-size:12px}.action{display:inline-block;padding:10px 15px;border:1px solid #62666c;border-radius:6px;background:#282b30;text-decoration:none;font-size:12px}.split{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;margin-top:22px}.screen{background:#222;border:1px solid var(--line);border-radius:10px;overflow:hidden}.screen img{display:block;width:100%;height:auto}.screen .bar{padding:10px 16px;color:var(--muted);font:11px monospace;display:flex;justify-content:space-between}.summary{border:1px solid var(--line);border-radius:10px;padding:24px;background:var(--panel)}.row{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.row:last-child{border:0}.row b{font:18px monospace}.row span{font-size:14px}.row small{display:block;color:var(--muted);font-size:11px}.repair-grid{display:grid;grid-template-columns:330px 1fr;gap:22px}.finding{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:10px}.finding.active{background:var(--paper);color:#15171a}.finding small{display:block;font:11px monospace;margin-top:7px}.sheet{background:var(--paper);color:#17191b;padding:32px;border-radius:10px;min-height:400px}.sheet p{color:#555d62}.sheet .eyebrow{color:#555d62}.compare-values{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.value{border:1px solid #bbc0c0;border-radius:6px;padding:18px;overflow-wrap:anywhere}.value small{display:block;font:10px monospace;letter-spacing:2px;margin-bottom:15px;color:#555}.value strong{font-size:19px;line-height:1.4}.proof{padding:18px;background:#dde1da;border-radius:6px}.proof p{font-size:13px}.screens{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:20px 0}.notice{font-size:13px;margin:12px 0;color:#c4c7ca}.empty{padding:45px;border:1px solid var(--line);border-radius:10px}.evidence-links{display:flex;flex-wrap:wrap;gap:12px}footer{border-top:1px solid var(--line);padding:20px 4vw;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:15px}:focus-visible{outline:3px solid #fff;outline-offset:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.screen img[hidden]{display:none}@media(max-width:1000px){.flow{grid-template-columns:repeat(3,1fr)}.flow:before{display:none}.split,.screens{grid-template-columns:1fr}.repair-grid{grid-template-columns:260px 1fr}.hero{align-items:flex-start}}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}select{width:100%;max-width:100%}main{padding:24px 5vw}.hero,.detail,.gate{display:block}.pill{display:inline-block;margin-top:15px}.metrics{grid-template-columns:1fr 1fr}.metric{padding:12px}.metric strong{font-size:25px}.flow{grid-template-columns:1fr 1fr;gap:10px}.canvas{padding:15px}.station{padding:12px}.repair-grid,.compare-values{grid-template-columns:1fr}.tabs{gap:22px}.tabs button{font-size:13px}.sheet{padding:22px}.gate a{margin-top:15px}footer{flex-direction:column}}
</style></head><body><header><div class="brand"><b>Kujo</b><span>WEBOPS FACTORY</span></div><select id="picker" aria-label="Choose run"><option>Loading runs…</option></select></header><main><div class="hero"><div><div class="eyebrow" id="context">Website operations</div><h1 id="title">Find the problem. Prove the fix.</h1><p>Website repairs with real evidence, clear ownership and a reviewable result.</p></div><span class="pill" id="status">Reading evidence</span></div><div class="metrics" id="metrics"></div><nav class="tabs" aria-label="Factory views"><button data-tab="floor" aria-selected="true">Factory floor</button><button data-tab="repairs" aria-selected="false">Repairs</button><button data-tab="proof" aria-selected="false">Before & after</button></nav><div id="notice" class="notice"></div><section id="floor" class="view"></section><section id="repairs" class="view" hidden></section><section id="proof" class="view" hidden></section></main><footer><span>Actual run records · Refreshes every three seconds</span><span>Model review is not human approval. No deployment from this floor.</span></footer>
<script>
const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};let runs=[],selected='',data=null,signature='',tab='floor',station=0,finding=0,busy=false;const names=['Snapshot','Inspect','Propose','Repair','Verify','Package'],roles=['Trusted intake','SiteProbe · Lens','Three WebOps specialists','Bounded patch controller','Site QA Operator','Exact files · Human review'],descriptions=['Keep the original site intact. Every imported file is copied and hashed.','Crawl the site and capture desktop and mobile browser evidence.','Metadata, link health and accessibility specialists propose scoped repairs.','Apply allowed edits to the candidate copy. No commands or new scripts from agents.','Repeat the checks and have an independent reviewer assess the exact changes.','Review the repaired copy, patch and evidence. You decide what goes live.'];
function action(text,fn,cls='action'){const n=el('button',text,cls);n.onclick=fn;return n}function url(path){return '/artifact/'+encodeURIComponent(data?.state.id||selected)+'/'+path}function link(text,path){const n=el('a',text,'action');n.href=url(path);n.target='_blank';n.rel='noopener';return n}function show(name){tab=name;for(const n of ['floor','repairs','proof'])$(n).hidden=n!==name;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===name)))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function screen(label,phase){const box=el('div',undefined,'screen'),bar=el('div',undefined,'bar');bar.append(el('span',label),el('span','Lens · desktop'));box.append(bar);if(data.evidence[phase]){const img=el('img');img.src=url('evidence/'+phase+'/lens/screenshots/desktop.png');img.alt=label+' website screenshot';box.append(img)}else box.append(el('p','Screenshot available after this check completes.'));return box}
function gate(){const g=el('div',undefined,'gate'),copy=el('div');copy.append(el('h3',data.state.status==='approval_required'?'Ready for your review. Nothing deployed.':'Your original site stays untouched.'),el('p','Review the exact candidate and its evidence before applying or publishing changes.'));g.append(copy);if(data.state.packageSha256)g.append(link('Inspect the package ↗','package.json'));return g}
function renderFloor(){const root=$('floor');root.replaceChildren();const canvas=el('div',undefined,'canvas'),flow=el('div',undefined,'flow');for(let i=0;i<6;i++){const state=data.state.stage>i?'complete':data.state.stage===i?(data.state.status==='blocked'?'blocked':'in progress'):'waiting';const b=action('',()=>{const y=scrollY;station=i;renderFloor();document.querySelector('[data-station="'+i+'"]').focus({preventScroll:true});scrollTo(0,y)},'station'+(station===i?' active':''));b.dataset.station=i;b.setAttribute('aria-pressed',String(station===i));b.append(el('span',String(i+1).padStart(2,'0'),'number'),el('h3',names[i]),el('small',roles[i]),el('em',(state==='complete'?'✓ ':'')+state));flow.append(b)}canvas.append(flow);root.append(canvas);const detail=el('div',undefined,'detail'),copy=el('div');copy.append(el('div',roles[station],'eyebrow'),el('h3',names[station]));detail.append(copy,el('p',descriptions[station]));root.append(detail);const split=el('div',undefined,'split'),summary=el('div',undefined,'summary');summary.append(el('h2','Make the site easier to use.'),el('p','Targeted repairs, with a reason and proof for each one.'));for(const f of data.before){const row=el('div',undefined,'row');row.append(el('b',data.after&&!data.after.some(x=>x.id===f.id)?'✓':'→'));const text=el('span',f.label);text.append(el('small',f.file));row.append(text);summary.append(row)}split.append(screen('The example website','before'),summary);root.append(split,gate())}
function renderRepairs(){const root=$('repairs');root.replaceChildren();if(!data.before.length){root.append(el('p','Findings will appear after inspection.'));return}finding=Math.min(finding,data.before.length-1);const grid=el('div',undefined,'repair-grid'),rail=el('div');data.before.forEach((f,i)=>{const b=action('',()=>{const y=scrollY;finding=i;renderRepairs();document.querySelector('[data-finding="'+i+'"]').focus({preventScroll:true});scrollTo(0,y)},'finding'+(finding===i?' active':''));b.dataset.finding=i;b.append(el('h3',f.label),el('small',f.file));rail.append(b)});const f=data.before[finding],edit=data.edits.find(e=>e.findingId===f.id),sheet=el('div',undefined,'sheet');sheet.append(el('div',f.kind==='broken_link'?'LINK HEALTH AUDITOR':f.kind==='image_alt'?'ACCESSIBILITY AUDITOR':'METADATA AUDITOR','eyebrow'),el('h2',f.label));const values=el('div',undefined,'compare-values');for(const [label,text] of [['BEFORE',f.kind==='broken_link'?f.tag.attrs.href:'Missing'],['CANDIDATE',edit?.value||'Waiting for proposal']]){const v=el('div',undefined,'value');v.append(el('small',label),el('strong',text));values.append(v)}sheet.append(values,el('p',edit?.reason||'A specialist will propose a bounded repair.'));if(data.after){const proof=el('div',undefined,'proof');proof.append(el('h3',data.after.some(x=>x.id===f.id)?'Still needs work':'✓ This targeted check now passes'),el('p','The trusted audit reran against the candidate files. Browser and model review evidence are retained separately.'));sheet.append(proof)}sheet.append(el('p','The original source is preserved. These edits exist only in the candidate copy.'));grid.append(rail,sheet);root.append(grid,gate())}
function renderProof(){const root=$('proof');root.replaceChildren();root.append(el('h2','See what changed. Inspect what passed.'),el('p','The design stays familiar. The supporting evidence shows the repairs underneath.'));const images=el('div',undefined,'screens');images.append(screen('Original site','before'),screen('Candidate site','after'));root.append(images);const links=el('div',undefined,'evidence-links');if(data.evidence.before)links.append(link('Before browser report','evidence/before/lens/lens-report.md'));if(data.evidence.after)links.append(link('After browser report','evidence/after/lens/lens-report.md'),link('Crawl findings','evidence/after/siteprobe/findings.json'));if(data.edits.length)links.append(link('Inspect exact patch','patches/repairs.diff'));if(data.review)links.append(link('Independent model review','review.json'));root.append(links);if(data.other!==null)root.append(el('p',data.other+' additional crawl finding(s) remain outside the four supported repair checks. Review the crawl report; this is not a clean bill of health.'));root.append(gate())}
async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/api/runs');if(!r.ok)throw Error('Run list unavailable');runs=await r.json();if(!runs.length){$('status').textContent='Ready for a website';$('floor').replaceChildren(el('div','Run npm run factory -- run examples/studio.json --live to start the example.','empty'));return}if(!runs.some(r=>r.id===selected))selected=runs[0].id;const state=runs.find(r=>r.id===selected),sig=JSON.stringify(state);const picker=$('picker');picker.replaceChildren(...runs.map(r=>{const o=el('option',r.title+' · '+r.mode+' · '+r.status.replaceAll('_',' '));o.value=r.id;return o}));picker.value=selected;if(sig===signature)return;const id=selected;async function get(path){const r=await fetch('/artifact/'+encodeURIComponent(id)+'/'+path);return r.ok?r.json():null}const [before,after,edits,review,eb,ea,crawl]=await Promise.all(['before-findings.json','after-findings.json','patches/edits.json','review.json','evidence/before/lens/lens-report.json','evidence/after/lens/lens-report.json','evidence/after/siteprobe/findings.json'].map(get));if(selected!==id)return;data={state,before:before||[],after,edits:edits||[],review,evidence:{before:!!eb,after:!!ea},other:crawl?crawl.findings.length:null};signature=sig;$('context').textContent=(state.mode==='fixture'?'FIXTURE REHEARSAL / ':'LIVE PROVIDER RUN / ')+state.title;$('status').textContent=state.status==='approval_required'?'Awaiting your review':state.status.replaceAll('_',' ');$('title').textContent=state.status==='approval_required'?state.counts.repaired+' targeted problems. Verified repairs.':'Find the problem. Prove the fix.';$('metrics').replaceChildren();for(const [n,label] of [[state.counts.before??'—','targeted findings before'],[state.counts.after??'—','targeted findings after'],[state.counts.pages??'—','pages inspected'],[state.providerCalls,'live agent calls']]){const m=el('div',undefined,'metric');m.append(el('strong',String(n)),el('span',label));$('metrics').append(m)}$('notice').textContent=state.error?'Run stopped: '+state.error:'';renderFloor();renderRepairs();renderProof();show(tab)}catch(e){$('notice').textContent='Could not read run evidence: '+e.message}finally{busy=false}}
$('picker').onchange=()=>{selected=$('picker').value;signature='';refresh()};refresh();setInterval(refresh,3000);
</script></body></html>
